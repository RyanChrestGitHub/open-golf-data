name: Contract and replay CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test immutable observation and identity contracts
        run: python -m unittest discover -s tests -v
      - name: Replay synthetic laboratory and inspect result
        run: |
          python -m open_golf_data demo --output /tmp/ogd-lab
          python -m open_golf_data inspect /tmp/ogd-lab/events.sqlite
