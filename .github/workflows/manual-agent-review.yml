name: Optional independent agent review (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent non-mutating Codex assessment
        id: codex_review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/agent-prompts/independent-review.md
          sandbox: read-only
          read-only: true
          safety-strategy: drop-sudo
          output-file: agent-review.md
      - name: Retain review as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: independent-agent-review
          path: agent-review.md
          retention-days: 14
