name: Collector defect or data-fidelity report
description: Report a reproducible issue without exposing private player data
body:
  - type: input
    id: version
    attributes:
      label: Collector version / commit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction steps (sanitized)
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Failure class
      options: [Source access, Event loss or duplication, Field fidelity, Attribution, Privacy, Other]
    validations:
      required: true
