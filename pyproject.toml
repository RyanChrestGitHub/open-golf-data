[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-golf-data-lab"
version = "0.0.1"
description = "An open, local-first laboratory for portable launch monitor observations"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
ogd = "open_golf_data.cli:main"

[tool.setuptools]
packages = ["open_golf_data"]

[tool.setuptools.package-data]
open_golf_data = ["fixtures/*.json"]
